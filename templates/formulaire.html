{% extends "base.html" %}

{% block content %}
<form id="contactForm" class="contactForm">
    <label for="objet">{{ _("Objet") }}</label>
    <input type="text" id="objet" name="objet" required>

    <label for="message">{{ _("Message") }}</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">{{ _("Envoyer") }}</button>
</form>

<script>
document.getElementById("contactForm").addEventListener("submit", function (event) {
    event.preventDefault();

    const objet = document.getElementById("objet").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!objet || !message) {
        alert({{ _("Merci de remplir tous les champs.") | tojson }});
        return;
    }

    const subject = encodeURIComponent(objet);
    const body = encodeURIComponent(message);

    window.location.href = `mailto:ddcorp@assofl.fr?subject=${subject}&body=${body}`;

    alert({{ _("Merci pour votre message !") | tojson }});
    this.reset();
});
</script>
{% endblock %}
