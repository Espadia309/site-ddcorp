<nav class="site-nav">
    <a class="nav-logo" href="{{ url_for('public.home') }}"
       {% if request.path == url_for('public.home') %}aria-current="page"{% endif %}>
        <img src="{{ url_for('static', filename='images/Logo_Ddcorp_2.png') }}"
             width="50" height="50" alt="DDCORP"/>
        <span><em>Accueil</em></span>
    </a>

    <button class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Ouvrir le menu"
            aria-controls="nav-links"
            aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-links" id="nav-links">
        <a href="{{ url_for('public.actus') }}"
           {% if request.path == url_for('public.actus') %}class="active"{% endif %}>
            Actualités
        </a>

        <a href="{{ url_for('public.equipe') }}"
           {% if request.path == url_for('public.equipe') %}class="active"{% endif %}>
            Équipe
        </a>

        <a href="{{ url_for('public.robot') }}"
           {% if request.path.startswith('/robot') %}class="active"{% endif %}>
            Robot Game
        </a>

        <div class="dropdown
            {% if request.path.startswith('/projet') %}current-section{% endif %}">
            <a class="dropdown-toggle"
               href="{{ url_for('public.projet') }}"
               {% if request.path.startswith('/projet') %}aria-current="page"{% endif %}>
                Projets
                <span class="dropdown-arrow" aria-hidden="true">▾</span>
            </a>

            <div class="dropdown-content">
                <a href="{{ url_for('public.vestige') }}">Vestige</a>
                <a href="{{ url_for('public.hydrache') }}">Hydrache</a>
            </div>
        </div>

        <a href="{{ url_for('public.recompenses') }}"
           {% if request.path == url_for('public.recompenses') %}class="active"{% endif %}>
            Récompenses
        </a>

        {% if current_user.is_authenticated %}
        <div class="dropdown dropdown-user
            {% if request.path.startswith(('/espace-equipe', '/compte', '/admin')) %}current-section{% endif %}">
            <button class="dropdown-toggle" type="button" aria-haspopup="true">
                Mon espace
                <span class="dropdown-arrow" aria-hidden="true">▾</span>
            </button>

            <div class="dropdown-content">
                <a href="{{ url_for('team.dashboard') }}"
                   {% if request.path.startswith('/espace-equipe') %}aria-current="page"{% endif %}>Espace équipe</a>
                <a href="{{ url_for('account.account') }}">Mon compte</a>
                {% if current_user.is_admin %}
                <a href="{{ url_for('admin.dashboard') }}">Admin</a>
                {% endif %}
                <a href="{{ url_for('auth.logout') }}">Se déconnecter</a>
            </div>
        </div>
        {% endif %}

        <a href="{{ url_for('public.formulaire') }}"
           {% if request.path == url_for('public.formulaire') %}class="active"{% endif %}>
            Contact
        </a>

        <button id="theme-switch"
                class="theme-switch"
                type="button"
                aria-label="Changer de thème">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" viewBox="0 -960 960 960"
                 fill="currentColor" aria-hidden="true">
                <path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" viewBox="0 -960 960 960"
                 fill="currentColor" aria-hidden="true">
                <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
            </svg>
        </button>
    </div>
</nav>
